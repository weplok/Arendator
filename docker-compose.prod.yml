x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-arend.weplok.space}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://arend.weplok.space}
  DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-true}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?Set DJANGO_SUPERUSER_EMAIL in .env.production}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env.production}
  DJANGO_SUPERUSER_NAME: ${DJANGO_SUPERUSER_NAME:-Администратор}
  DATABASE_ENGINE: django.db.backends.postgresql
  POSTGRES_DB: ${POSTGRES_DB:-arendator}
  POSTGRES_USER: ${POSTGRES_USER:-arendator}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  DJANGO_MEDIA_ROOT: /app/media
  YANDEX_S3_BUCKET: ${YANDEX_S3_BUCKET:-}
  YANDEX_S3_ACCESS_KEY_ID: ${YANDEX_S3_ACCESS_KEY_ID:-}
  YANDEX_S3_SECRET_ACCESS_KEY: ${YANDEX_S3_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arendator}
      POSTGRES_USER: ${POSTGRES_USER:-arendator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  backend:
    image: arendator-backend:production
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment: *backend-environment
    volumes:
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'arend.weplok.space', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  celery-worker:
    image: arendator-backend:production
    restart: unless-stopped
    init: true
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    environment: *backend-environment
    volumes:
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  celery-beat:
    image: arendator-backend:production
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/var/run/celery/celerybeat-schedule
    environment: *backend-environment
    volumes:
      - media-data:/app/media
      - celerybeat-data:/var/run/celery
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: arendator-frontend:production
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *default-logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/arendator.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-config:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - media-data:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *default-logging

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: ["certificate"]
    ports:
      - "80:80"
    volumes:
      - certbot-config:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["certbot"]
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  media-data:
  celerybeat-data:
  certbot-config:
  certbot-webroot:
