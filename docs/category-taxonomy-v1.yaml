        characteristics:
          - { name: "Производительность осушения", type: NUMBER, required: true, unit: "л/сут." }
          - { name: "Площадь помещения", type: NUMBER, required: true, unit: "м²" }
          - { name: "Объём бака", type: NUMBER, required: true, unit: "л" }
          - { name: "Непрерывный слив", type: BOOLEAN, required: true }
      - name: "Холодильники и морозильники"
        characteristics:
          - { name: "Тип техники", type: LIST, required: true, options: ["холодильник", "морозильник", "холодильная витрина"] }
          - { name: "Общий объём", type: NUMBER, required: true, unit: "л" }
          - { name: "Температурный режим", type: LIST, required: true, options: ["охлаждение", "заморозка", "охлаждение и заморозка"] }
          - { name: "Колёса", type: BOOLEAN, required: true }

  - name: "Спортивное и туристическое снаряжение"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["туризм", "велоспорт", "водный спорт", "зимний спорт", "фитнес"] }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
