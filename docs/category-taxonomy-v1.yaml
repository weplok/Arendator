        characteristics:
          - { name: "Длина", type: NUMBER, required: true, unit: "см" }
          - { name: "Максимальная нагрузка", type: NUMBER, required: true, unit: "кг" }
          - { name: "Тип сапборда", type: LIST, required: true, options: ["прогулочный", "туринговый", "гоночный", "для йоги"] }
          - { name: "Весло в комплекте", type: BOOLEAN, required: true }

  - name: "Медицинское и реабилитационное оборудование"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["передвижение", "уход", "дыхательная поддержка", "восстановление"] }
