      - name: "Туристические палатки"
        characteristics:
          - { name: "Количество мест", type: NUMBER, required: true, unit: "чел." }
          - { name: "Сезонность", type: LIST, required: true, options: ["летняя", "трёхсезонная", "зимняя"] }
          - { name: "Вес", type: NUMBER, required: true, unit: "кг" }
