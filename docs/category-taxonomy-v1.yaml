# Проект стартовой таксономии для ручного заполнения администратором.
#
# Это справочный файл, а не fixture и не команда импорта: он не добавляет
# категории или характеристики в БД. Характеристики каждого узла автономны:
# значения родительской категории не наследуются дочерним категориям.

version: 1
status: proposed
format:
  category:
    name: "Самодостаточное название категории"
    children: "Необязательный список дочерних категорий"
    characteristics: "Собственные характеристики категории"
  characteristic:
    name: "Название характеристики"
    type: "LIST | NUMBER | BOOLEAN"
    required: "true | false"
    options: "Только для LIST; до 10 первоначальных значений"
    unit: "Только для NUMBER; строчная сокращённая единица"

categories:
  - name: "Электроинструменты"
    characteristics:
      - { name: "Питание", type: LIST, required: true, options: ["аккумулятор", "сеть 220 в", "сеть 380 в"] }
      - { name: "Мощность", type: NUMBER, required: false, unit: "вт" }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
      - { name: "Ударный режим", type: BOOLEAN, required: false }
    children:
      - name: "Аккумуляторные шуруповёрты"
        characteristics:
          - { name: "Напряжение аккумулятора", type: NUMBER, required: true, unit: "в" }
          - { name: "Ёмкость аккумулятора", type: NUMBER, required: false, unit: "ач" }
          - { name: "Максимальный крутящий момент", type: NUMBER, required: false, unit: "н·м" }
          - { name: "Количество аккумуляторов в комплекте", type: NUMBER, required: true, unit: "шт." }
          - { name: "Ударный режим", type: BOOLEAN, required: true }
      - name: "Электрические дрели"
        characteristics:
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "аккумулятор"] }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Максимальный диаметр сверления", type: NUMBER, required: true, unit: "мм" }
          - { name: "Ударный режим", type: BOOLEAN, required: true }
      - name: "Перфораторы"
        characteristics:
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "аккумулятор"] }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Энергия удара", type: NUMBER, required: true, unit: "дж" }
          - { name: "Тип патрона", type: LIST, required: true, options: ["sds-plus", "sds-max"] }
          - { name: "Режим долбления", type: BOOLEAN, required: true }
      - name: "Углошлифовальные машины"
        characteristics:
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "аккумулятор"] }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Диаметр диска", type: NUMBER, required: true, unit: "мм" }
          - { name: "Регулировка оборотов", type: BOOLEAN, required: true }

  - name: "Ручные инструменты и строительная оснастка"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["столярные работы", "слесарные работы", "малярные работы", "монтаж", "кладка"] }
      - { name: "Материал рабочей части", type: LIST, required: false, options: ["сталь", "нержавеющая сталь", "алюминий", "пластик"] }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
    children:
      - name: "Наборы ручных инструментов"
        characteristics:
          - { name: "Назначение", type: LIST, required: true, options: ["автомобильные работы", "слесарные работы", "электромонтаж", "универсальные работы"] }
          - { name: "Количество предметов", type: NUMBER, required: true, unit: "шт." }
          - { name: "Кейс в комплекте", type: BOOLEAN, required: true }
      - name: "Строительные лестницы и стремянки"
        characteristics:
          - { name: "Тип конструкции", type: LIST, required: true, options: ["приставная лестница", "стремянка", "трансформер", "телескопическая лестница"] }
          - { name: "Рабочая высота", type: NUMBER, required: true, unit: "м" }
          - { name: "Максимальная нагрузка", type: NUMBER, required: true, unit: "кг" }
          - { name: "Диэлектрическое покрытие", type: BOOLEAN, required: true }
      - name: "Строительные леса и вышки-туры"
        characteristics:
          - { name: "Тип конструкции", type: LIST, required: true, options: ["рамные леса", "хомутовые леса", "вышка-тура"] }
          - { name: "Рабочая высота", type: NUMBER, required: true, unit: "м" }
          - { name: "Ширина рабочей площадки", type: NUMBER, required: true, unit: "м" }
          - { name: "Колёса", type: BOOLEAN, required: true }

  - name: "Измерительное и геодезическое оборудование"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["измерение расстояний", "выравнивание", "геодезическая съёмка", "тепловизионный контроль"] }
      - { name: "Погрешность", type: NUMBER, required: false, unit: "мм" }
      - { name: "Питание", type: LIST, required: false, options: ["батарейки", "аккумулятор", "сеть 220 в"] }
    children:
      - name: "Лазерные уровни"
        characteristics:
          - { name: "Количество плоскостей", type: NUMBER, required: true, unit: "шт." }
          - { name: "Дальность работы", type: NUMBER, required: true, unit: "м" }
          - { name: "Точность", type: NUMBER, required: true, unit: "мм/м" }
          - { name: "Зелёный луч", type: BOOLEAN, required: true }
      - name: "Лазерные дальномеры"
        characteristics:
          - { name: "Максимальная дальность измерения", type: NUMBER, required: true, unit: "м" }
          - { name: "Точность", type: NUMBER, required: true, unit: "мм" }
          - { name: "Вычисление площади и объёма", type: BOOLEAN, required: true }
      - name: "Тепловизоры"
        characteristics:
          - { name: "Разрешение матрицы", type: LIST, required: true, options: ["160 × 120", "256 × 192", "320 × 240", "384 × 288", "640 × 480"] }
          - { name: "Температурный диапазон", type: LIST, required: true, options: ["−20…150 °c", "−20…300 °c", "−20…550 °c", "0…650 °c"] }
          - { name: "Тепловая чувствительность", type: NUMBER, required: false, unit: "мк" }
          - { name: "Запись фото", type: BOOLEAN, required: true }

  - name: "Сварочное и газорезательное оборудование"
    characteristics:
      - { name: "Тип питания", type: LIST, required: true, options: ["сеть 220 в", "сеть 380 в", "бензин", "дизель"] }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
      - { name: "Комплект кабелей", type: BOOLEAN, required: true }
    children:
      - name: "Сварочные аппараты"
        characteristics:
          - { name: "Тип сварки", type: LIST, required: true, options: ["mma", "mig/mag", "tig", "универсальный"] }
          - { name: "Сварочный ток", type: NUMBER, required: true, unit: "а" }
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "сеть 380 в"] }
          - { name: "Режим аргонодуговой сварки", type: BOOLEAN, required: true }
      - name: "Плазменные резаки"
        characteristics:
          - { name: "Максимальная толщина реза", type: NUMBER, required: true, unit: "мм" }
          - { name: "Ток реза", type: NUMBER, required: true, unit: "а" }
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "сеть 380 в"] }
          - { name: "Компрессор встроен", type: BOOLEAN, required: true }
      - name: "Газовые резаки"
        characteristics:
          - { name: "Тип газа", type: LIST, required: true, options: ["пропан", "ацетилен", "метан"] }
          - { name: "Максимальная толщина реза", type: NUMBER, required: true, unit: "мм" }
          - { name: "Шланги в комплекте", type: BOOLEAN, required: true }

  - name: "Бетонное и отделочное оборудование"
    characteristics:
      - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "сеть 380 в", "бензин"] }
      - { name: "Производительность", type: NUMBER, required: false, unit: "м³/ч" }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
    children:
      - name: "Бетономешалки"
        characteristics:
          - { name: "Объём барабана", type: NUMBER, required: true, unit: "л" }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Напряжение", type: LIST, required: true, options: ["220 в", "380 в"] }
          - { name: "Колёса", type: BOOLEAN, required: true }
      - name: "Вибраторы для бетона"
        characteristics:
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "сеть 380 в", "бензин"] }
          - { name: "Длина гибкого вала", type: NUMBER, required: true, unit: "м" }
          - { name: "Диаметр вибробулавы", type: NUMBER, required: true, unit: "мм" }
      - name: "Плиткорезы"
        characteristics:
          - { name: "Тип плиткореза", type: LIST, required: true, options: ["ручной", "электрический"] }
          - { name: "Максимальная длина реза", type: NUMBER, required: true, unit: "мм" }
          - { name: "Максимальная толщина реза", type: NUMBER, required: true, unit: "мм" }
          - { name: "Водяное охлаждение", type: BOOLEAN, required: true }

  - name: "Энергетическое и пневматическое оборудование"
    characteristics:
      - { name: "Тип оборудования", type: LIST, required: true, options: ["генератор", "компрессор", "пневмоинструмент", "тепловая пушка"] }
      - { name: "Мощность", type: NUMBER, required: false, unit: "вт" }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
    children:
      - name: "Бензиновые генераторы"
        characteristics:
          - { name: "Номинальная мощность", type: NUMBER, required: true, unit: "квт" }
          - { name: "Максимальная мощность", type: NUMBER, required: true, unit: "квт" }
          - { name: "Объём топливного бака", type: NUMBER, required: true, unit: "л" }
          - { name: "Электростартер", type: BOOLEAN, required: true }
      - name: "Дизельные генераторы"
        characteristics:
          - { name: "Номинальная мощность", type: NUMBER, required: true, unit: "квт" }
          - { name: "Напряжение", type: LIST, required: true, options: ["220 в", "380 в", "220/380 в"] }
          - { name: "Объём топливного бака", type: NUMBER, required: true, unit: "л" }
          - { name: "Автозапуск", type: BOOLEAN, required: true }
      - name: "Воздушные компрессоры"
        characteristics:
          - { name: "Производительность", type: NUMBER, required: true, unit: "л/мин" }
          - { name: "Объём ресивера", type: NUMBER, required: true, unit: "л" }
          - { name: "Рабочее давление", type: NUMBER, required: true, unit: "бар" }
          - { name: "Безмасляный", type: BOOLEAN, required: true }

  - name: "Клининговое оборудование"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["сухая уборка", "влажная уборка", "мойка поверхностей", "чистка паром"] }
      - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "аккумулятор", "бензин"] }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
    children:
      - name: "Аппараты высокого давления"
        characteristics:
          - { name: "Рабочее давление", type: NUMBER, required: true, unit: "бар" }
          - { name: "Расход воды", type: NUMBER, required: true, unit: "л/ч" }
          - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "бензин"] }
          - { name: "Подогрев воды", type: BOOLEAN, required: true }
      - name: "Промышленные пылесосы"
        characteristics:
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Объём бака", type: NUMBER, required: true, unit: "л" }
          - { name: "Тип уборки", type: LIST, required: true, options: ["сухая", "сухая и влажная", "сбор строительной пыли"] }
          - { name: "Розетка для электроинструмента", type: BOOLEAN, required: true }
      - name: "Поломоечные машины"
        characteristics:
          - { name: "Ширина уборки", type: NUMBER, required: true, unit: "мм" }
          - { name: "Производительность", type: NUMBER, required: true, unit: "м²/ч" }
          - { name: "Тип питания", type: LIST, required: true, options: ["аккумулятор", "сеть 220 в"] }
          - { name: "Самоходная", type: BOOLEAN, required: true }

  - name: "Садовая техника"
    characteristics:
      - { name: "Питание", type: LIST, required: true, options: ["бензин", "аккумулятор", "сеть 220 в"] }
      - { name: "Мощность", type: NUMBER, required: false, unit: "вт" }
      - { name: "Вес", type: NUMBER, required: false, unit: "кг" }
    children:
      - name: "Газонокосилки"
        characteristics:
          - { name: "Тип газонокосилки", type: LIST, required: true, options: ["колёсная", "робот", "райдер"] }
          - { name: "Питание", type: LIST, required: true, options: ["бензин", "аккумулятор", "сеть 220 в"] }
          - { name: "Ширина скашивания", type: NUMBER, required: true, unit: "см" }
          - { name: "Травосборник", type: BOOLEAN, required: true }
      - name: "Садовые триммеры"
        characteristics:
          - { name: "Питание", type: LIST, required: true, options: ["бензин", "аккумулятор", "сеть 220 в"] }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Ширина скашивания", type: NUMBER, required: true, unit: "см" }
          - { name: "Ремень в комплекте", type: BOOLEAN, required: true }
      - name: "Бензопилы"
        characteristics:
          - { name: "Длина шины", type: NUMBER, required: true, unit: "см" }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Шаг цепи", type: LIST, required: true, options: ["1/4 дюйма", "3/8 дюйма", "0,325 дюйма", "0,404 дюйма"] }
          - { name: "Цепь в комплекте", type: BOOLEAN, required: true }

  - name: "Спецтехника"
    characteristics:
      - { name: "Тип привода", type: LIST, required: true, options: ["гусеничный", "колёсный", "полный"] }
      - { name: "Масса", type: NUMBER, required: false, unit: "т" }
      - { name: "Требуется водитель оператора", type: BOOLEAN, required: true }
    children:
      - name: "Мини-экскаваторы"
        characteristics:
          - { name: "Эксплуатационная масса", type: NUMBER, required: true, unit: "т" }
          - { name: "Глубина копания", type: NUMBER, required: true, unit: "м" }
          - { name: "Ширина ковша", type: NUMBER, required: true, unit: "мм" }
          - { name: "Гидромолот в комплекте", type: BOOLEAN, required: true }
      - name: "Фронтальные погрузчики"
        characteristics:
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Высота разгрузки", type: NUMBER, required: true, unit: "м" }
          - { name: "Объём ковша", type: NUMBER, required: true, unit: "м³" }
          - { name: "Кабина закрытая", type: BOOLEAN, required: true }
      - name: "Автовышки"
        characteristics:
          - { name: "Рабочая высота", type: NUMBER, required: true, unit: "м" }
          - { name: "Грузоподъёмность люльки", type: NUMBER, required: true, unit: "кг" }
          - { name: "Тип стрелы", type: LIST, required: true, options: ["телескопическая", "коленчатая"] }
          - { name: "Требуется водитель оператора", type: BOOLEAN, required: true }

  - name: "Складское и грузоподъёмное оборудование"
    characteristics:
      - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
      - { name: "Высота подъёма", type: NUMBER, required: false, unit: "м" }
      - { name: "Самоходное", type: BOOLEAN, required: true }
    children:
      - name: "Ручные гидравлические тележки"
        characteristics:
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Длина вил", type: NUMBER, required: true, unit: "мм" }
          - { name: "Высота подъёма", type: NUMBER, required: true, unit: "мм" }
          - { name: "Весы встроены", type: BOOLEAN, required: true }
      - name: "Штабелеры"
        characteristics:
          - { name: "Тип штабелера", type: LIST, required: true, options: ["ручной", "электрический", "самоходный"] }
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Высота подъёма", type: NUMBER, required: true, unit: "м" }
          - { name: "Платформа для оператора", type: BOOLEAN, required: true }
      - name: "Вилочные погрузчики"
        characteristics:
          - { name: "Тип питания", type: LIST, required: true, options: ["электрический", "дизель", "газ-бензин"] }
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Высота подъёма", type: NUMBER, required: true, unit: "м" }
          - { name: "Кабина закрытая", type: BOOLEAN, required: true }

  - name: "Грузовой транспорт"
    characteristics:
      - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
      - { name: "Тип топлива", type: LIST, required: true, options: ["бензин", "дизель", "газ", "электричество"] }
      - { name: "Коробка передач", type: LIST, required: true, options: ["механическая", "автоматическая", "роботизированная"] }
      - { name: "Водитель включён", type: BOOLEAN, required: true }
    children:
      - name: "Грузовые фургоны"
        characteristics:
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Объём грузового отсека", type: NUMBER, required: true, unit: "м³" }
          - { name: "Тип топлива", type: LIST, required: true, options: ["бензин", "дизель", "газ", "электричество"] }
          - { name: "Водитель включён", type: BOOLEAN, required: true }
      - name: "Самосвалы"
        characteristics:
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "т" }
          - { name: "Объём кузова", type: NUMBER, required: true, unit: "м³" }
          - { name: "Тип разгрузки", type: LIST, required: true, options: ["задняя", "боковая", "трёхсторонняя"] }
          - { name: "Водитель включён", type: BOOLEAN, required: true }
      - name: "Грузовые прицепы"
        characteristics:
          - { name: "Грузоподъёмность", type: NUMBER, required: true, unit: "кг" }
          - { name: "Длина платформы", type: NUMBER, required: true, unit: "м" }
          - { name: "Тип кузова", type: LIST, required: true, options: ["бортовой", "тентованный", "фургон", "платформа"] }
          - { name: "Тормозная система", type: BOOLEAN, required: true }

  - name: "Пассажирский транспорт"
    characteristics:
      - { name: "Количество мест", type: NUMBER, required: true, unit: "чел." }
      - { name: "Тип топлива", type: LIST, required: true, options: ["бензин", "дизель", "гибрид", "электричество"] }
      - { name: "Коробка передач", type: LIST, required: true, options: ["механическая", "автоматическая", "роботизированная"] }
      - { name: "Кондиционер", type: BOOLEAN, required: true }
    children:
      - name: "Легковые автомобили"
        characteristics:
          - { name: "Класс автомобиля", type: LIST, required: true, options: ["эконом", "компакт", "средний", "бизнес", "внедорожник"] }
          - { name: "Количество мест", type: NUMBER, required: true, unit: "чел." }
          - { name: "Коробка передач", type: LIST, required: true, options: ["механическая", "автоматическая", "роботизированная"] }
          - { name: "Детское кресло", type: BOOLEAN, required: true }
      - name: "Минивэны"
        characteristics:
          - { name: "Количество мест", type: NUMBER, required: true, unit: "чел." }
          - { name: "Объём багажника", type: NUMBER, required: false, unit: "л" }
          - { name: "Коробка передач", type: LIST, required: true, options: ["механическая", "автоматическая", "роботизированная"] }
          - { name: "Детское кресло", type: BOOLEAN, required: true }
      - name: "Пассажирские микроавтобусы"
        characteristics:
          - { name: "Количество мест", type: NUMBER, required: true, unit: "чел." }
          - { name: "Тип топлива", type: LIST, required: true, options: ["бензин", "дизель", "газ"] }
          - { name: "Кондиционер", type: BOOLEAN, required: true }
          - { name: "Водитель включён", type: BOOLEAN, required: true }

  - name: "Фото-, видео- и аудиооборудование"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["фотосъёмка", "видеосъёмка", "звукозапись", "освещение"] }
      - { name: "Питание", type: LIST, required: false, options: ["аккумулятор", "сеть 220 в", "батарейки"] }
      - { name: "Кейс в комплекте", type: BOOLEAN, required: true }
    children:
      - name: "Фотокамеры"
        characteristics:
          - { name: "Тип фотокамеры", type: LIST, required: true, options: ["зеркальная", "беззеркальная", "компактная", "моментальная"] }
          - { name: "Разрешение матрицы", type: NUMBER, required: true, unit: "мп" }
          - { name: "Тип крепления объектива", type: LIST, required: false, options: ["canon ef", "canon rf", "nikon f", "nikon z", "sony e", "micro 4/3"] }
          - { name: "Объектив в комплекте", type: BOOLEAN, required: true }
      - name: "Видеокамеры"
        characteristics:
          - { name: "Максимальное разрешение видео", type: LIST, required: true, options: ["full hd", "2,7k", "4k", "6k", "8k"] }
          - { name: "Тип видеокамеры", type: LIST, required: true, options: ["экшн-камера", "видеокамера", "кинокамера", "360-камера"] }
          - { name: "Стабилизация изображения", type: BOOLEAN, required: true }
          - { name: "Микрофон в комплекте", type: BOOLEAN, required: true }
      - name: "Студийный свет"
        characteristics:
          - { name: "Тип света", type: LIST, required: true, options: ["постоянный", "импульсный", "кольцевой"] }
          - { name: "Мощность", type: NUMBER, required: true, unit: "вт" }
          - { name: "Цветовая температура", type: NUMBER, required: false, unit: "к" }
          - { name: "Стойка в комплекте", type: BOOLEAN, required: true }

  - name: "Оборудование для мероприятий"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["презентация", "сцена", "банкет", "выставка", "уличное мероприятие"] }
      - { name: "Монтаж включён", type: BOOLEAN, required: true }
      - { name: "Требуется электропитание", type: BOOLEAN, required: true }
    children:
      - name: "Проекторы"
        characteristics:
          - { name: "Яркость", type: NUMBER, required: true, unit: "лм" }
          - { name: "Разрешение", type: LIST, required: true, options: ["hd", "full hd", "wuxga", "4k"] }
          - { name: "Проекционное расстояние", type: NUMBER, required: false, unit: "м" }
          - { name: "Крепление в комплекте", type: BOOLEAN, required: true }
      - name: "Проекционные экраны"
        characteristics:
          - { name: "Тип экрана", type: LIST, required: true, options: ["напольный", "настенный", "натяжной", "на раме"] }
          - { name: "Диагональ", type: NUMBER, required: true, unit: "дюйм" }
          - { name: "Соотношение сторон", type: LIST, required: true, options: ["4:3", "16:9", "16:10"] }
          - { name: "Штатив в комплекте", type: BOOLEAN, required: true }
      - name: "Банкетная мебель"
        characteristics:
          - { name: "Тип мебели", type: LIST, required: true, options: ["стол", "стул", "барный стул", "коктейльный стол", "диван"] }
          - { name: "Количество мест", type: NUMBER, required: false, unit: "чел." }
          - { name: "Материал", type: LIST, required: false, options: ["пластик", "дерево", "металл", "ткань", "ротанг"] }
          - { name: "Складная", type: BOOLEAN, required: true }

  - name: "Компьютерная и офисная техника"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["работа", "презентация", "печать", "сеть", "игры"] }
      - { name: "Питание от сети 220 в", type: BOOLEAN, required: true }
      - { name: "Кабели в комплекте", type: BOOLEAN, required: true }
    children:
      - name: "Ноутбуки"
        characteristics:
          - { name: "Диагональ экрана", type: NUMBER, required: true, unit: "дюйм" }
          - { name: "Операционная система", type: LIST, required: true, options: ["windows 11", "macos", "linux", "без операционной системы"] }
          - { name: "Оперативная память", type: NUMBER, required: true, unit: "гб" }
          - { name: "Дискретная видеокарта", type: BOOLEAN, required: true }
      - name: "Принтеры и МФУ"
        characteristics:
          - { name: "Тип печати", type: LIST, required: true, options: ["лазерная", "струйная", "термосублимационная"] }
          - { name: "Цветная печать", type: BOOLEAN, required: true }
          - { name: "Формат печати", type: LIST, required: true, options: ["а4", "а3", "а2"] }
          - { name: "Автоподатчик документов", type: BOOLEAN, required: true }
      - name: "Мониторы"
        characteristics:
          - { name: "Диагональ экрана", type: NUMBER, required: true, unit: "дюйм" }
          - { name: "Разрешение", type: LIST, required: true, options: ["full hd", "2k", "4k", "ultrawide"] }
          - { name: "Частота обновления", type: NUMBER, required: false, unit: "гц" }
          - { name: "Крепление vesa", type: BOOLEAN, required: true }

  - name: "Бытовая и климатическая техника"
    characteristics:
      - { name: "Назначение", type: LIST, required: true, options: ["обогрев", "охлаждение", "осушение", "приготовление пищи", "хранение продуктов"] }
      - { name: "Мощность", type: NUMBER, required: false, unit: "вт" }
      - { name: "Питание", type: LIST, required: true, options: ["сеть 220 в", "газ", "аккумулятор"] }
    children:
      - name: "Мобильные кондиционеры"
        characteristics:
          - { name: "Площадь охлаждения", type: NUMBER, required: true, unit: "м²" }
