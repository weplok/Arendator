map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream arendator_backend {
    server backend:8000;
    keepalive 16;
}

upstream arendator_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name arend.weplok.space;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://arend.weplok.space$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arend.weplok.space;

    if ($host != "arend.weplok.space") {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/arend.weplok.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arend.weplok.space/privkey.pem;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Private photo acts are only returned by authenticated API views.
    location ^~ /media/handovers/ {
        return 404;
    }

    location ^~ /media/returns/ {
        return 404;
    }

    location ^~ /media/maintenance/ {
        return 404;
    }

    location ^~ /media/ {
        alias /var/www/media/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "private, no-transform";
    }

    location ^~ /api/ {
        proxy_pass http://arendator_backend;
    }

    location ^~ /admin/ {
        proxy_pass http://arendator_backend;
    }

    location ^~ /static/ {
        proxy_pass http://arendator_backend;
    }

    location ^~ /ws/ {
        proxy_pass http://arendator_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://arendator_frontend;
    }
}
